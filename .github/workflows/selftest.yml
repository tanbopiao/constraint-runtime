name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Component selftests
        run: |
          set -e
          for m in fence_rule_engine shadow_runner circuit_breaker replay_ledger settlement_receipt_gate identity_gate output_gate eval_replay; do
            echo "=== $m ==="
            python3 "src/$m.py" selftest
          done
      - name: End-to-end demo
        run: python3 examples/demo.py
      - name: Package build and MCP shell import
        run: |
          set -e
          pip install ".[build]" 2>/dev/null || pip install .
          python3 -c "from mcp_server import mcp; import asyncio; print('tools:', len(asyncio.run(mcp.list_tools())))"
